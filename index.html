<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Tu Lista - Catálogo</title>
    <!-- Tailwind CSS CDN para diseño rápido y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 1. BARRA DE NAVEGACIÓN (HEADER) -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo / Título -->
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-bold text-emerald-700 tracking-wide">Crea Tu Lista</span>
            </div>

            <!-- Menú de Navegación (Escritorio) -->
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-600">
                <a href="index.html" class="text-emerald-700 font-semibold">Inicio</a>
                <a href="#categorias" class="hover:text-emerald-600 transition">Útiles</a>
                <a href="#categorias" class="hover:text-emerald-600 transition">Arte y Manualidades</a>
                <a href="#categorias" class="hover:text-emerald-600 transition">Papelería</a>
                <a href="#categorias" class="hover:text-emerald-600 transition">Juguetes</a>
                <a href="#categorias" class="hover:text-emerald-600 transition">Lectura</a>
                <a href="#categorias" class="hover:text-emerald-600 transition">Aseo</a>
            </nav>

            <!-- Buscador e Ícono de Carrito -->
            <div class="flex items-center space-x-4">
                <div class="relative hidden lg:block">
                    <input type="text" placeholder="Buscar productos..." class="bg-gray-100 text-sm rounded-full pl-4 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-48">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-gray-400 text-sm"></i>
                </div>

                <!-- Botón Carrito con Contador -->
                <button id="btn-carrito" class="relative bg-emerald-700 text-white p-2.5 rounded-full hover:bg-emerald-800 transition">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>

                <!-- Botón Menú Hamburguesa (Móvil) -->
                <button id="menu-movil-btn" class="md:hidden text-gray-700 text-xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Menú desplegable para Celular (Oculto por defecto) -->
        <div id="menu-movil" class="hidden md:hidden bg-white border-t px-4 pt-2 pb-4 space-y-2">
            <a href="index.html" class="block py-2 text-emerald-700 font-semibold">Inicio</a>
            <a href="#categorias" class="block py-2 text-gray-600">Útiles</a>
            <a href="#categorias" class="block py-2 text-gray-600">Arte y Manualidades</a>
            <a href="#categorias" class="block py-2 text-gray-600">Papelería</a>
            <a href="#categorias" class="block py-2 text-gray-600">Juguetes</a>
            <a href="#categorias" class="block py-2 text-gray-600">Lectura</a>
            <a href="#categorias" class="block py-2 text-gray-600">Aseo</a>
        </div>
    </header>

    <!-- 2. SECCIÓN PRINCIPAL (HERO / BANNER) -->
    <section class="bg-gradient-to-b from-white to-gray-100 py-10 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <!-- Imagen de Banner Principal -->
            <div class="rounded-2xl overflow-hidden shadow-md mb-8 bg-white p-4">
                <img src="https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&q=80&w=1200" alt="Banner Papelería" class="w-full h-48 md:h-72 object-cover rounded-xl">
            </div>

            <!-- Botón de Llamado a la Acción -->
            <a href="#catalogo" class="inline-flex items-center space-x-2 bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-8 py-3.5 rounded-full shadow-lg transition transform hover:-translate-y-0.5">
                <i class="fa-solid fa-sparkles"></i>
                <span>VER CATÁLOGO</span>
            </a>
        </div>
    </section>

    <!-- 3. ACCESOS RÁPIDOS POR CATEGORÍAS (CÍRCULOS) -->
    <section id="categorias" class="py-12 max-w-6xl mx-auto px-4">
        <h2 class="text-center text-xl font-bold text-gray-700 mb-8">Explora por Categorías</h2>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6 text-center">
            <a href="#" class="group flex flex-col items-center">
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-emerald-600/40 bg-white flex items-center justify-center shadow-sm group-hover:border-emerald-600 group-hover:shadow-md transition">
                    <i class="fa-solid fa-school text-3xl text-emerald-700"></i>
                </div>
                <span class="mt-3 text-sm font-semibold text-gray-700 group-hover:text-emerald-700">Útiles</span>
            </a>
            <a href="#" class="group flex flex-col items-center">
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-emerald-600/40 bg-white flex items-center justify-center shadow-sm group-hover:border-emerald-600 group-hover:shadow-md transition">
                    <i class="fa-solid fa-paint-brush text-3xl text-emerald-700"></i>
                </div>
                <span class="mt-3 text-sm font-semibold text-gray-700 group-hover:text-emerald-700">Arte y Manualidades</span>
            </a>
            <a href="#" class="group flex flex-col items-center">
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-emerald-600/40 bg-white flex items-center justify-center shadow-sm group-hover:border-emerald-600 group-hover:shadow-md transition">
                    <i class="fa-solid fa-scroll text-3xl text-emerald-700"></i>
                </div>
                <span class="mt-3 text-sm font-semibold text-gray-700 group-hover:text-emerald-700">Papelería</span>
            </a>
            <a href="#" class="group flex flex-col items-center">
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-emerald-600/40 bg-white flex items-center justify-center shadow-sm group-hover:border-emerald-600 group-hover:shadow-md transition">
                    <i class="fa-solid fa-puzzle-piece text-3xl text-emerald-700"></i>
                </div>
                <span class="mt-3 text-sm font-semibold text-gray-700 group-hover:text-emerald-700">Juguetes</span>
            </a>
            <a href="#" class="group flex flex-col items-center">
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-emerald-600/40 bg-white flex items-center justify-center shadow-sm group-hover:border-emerald-600 group-hover:shadow-md transition">
                    <i class="fa-solid fa-book-open text-3xl text-emerald-700"></i>
                </div>
                <span class="mt-3 text-sm font-semibold text-gray-700 group-hover:text-emerald-700">Lectura</span>
            </a>
            <a href="#" class="group flex flex-col items-center">
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-emerald-600/40 bg-white flex items-center justify-center shadow-sm group-hover:border-emerald-600 group-hover:shadow-md transition">
                    <i class="fa-solid fa-pump-soap text-3xl text-emerald-700"></i>
                </div>
                <span class="mt-3 text-sm font-semibold text-gray-700 group-hover:text-emerald-700">Aseo</span>
            </a>
        </div>
    </section>

    <!-- 4. SECCIÓN DE CATÁLOGO (DONDE SE CARGARÁN LOS PRODUCTOS DEL JSON) -->
    <!-- 4. SECCIÓN DE CATÁLOGO ACTUALIZADA -->
    <section id="catalogo" class="py-12 max-w-6xl mx-auto px-4">
        <h2 id="titulo-seccion" class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Catálogo de Productos</h2>
        
        <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los productos se cargarán aquí -->
        </div>
    </section>

    <!-- SCRIPTS DE FUNCIONALIDAD -->
    <script>
        let todosLosProductos = [];
    
        const mapaCategorias = {
            "Útiles": ["Cuadernos", "Lapiceros", "Geometría", "Borradores"],
            "Arte y Manualidades": ["Pinturas", "Pinceles", "Lápices de colores"],
            "Papelería": ["Hojas bond", "Cartulinas", "Sobres"],
            "Juguetes": ["Didácticos", "Puzzles"],
            "Lectura": ["Libros", "Cuentos"],
            "Aseo": ["Jabones", "Papel toalla"]
        };
    
        async function cargarCatalogo() {
            try {
                const response = await fetch('productos.json');
                todosLosProductos = await response.json();
                
                // Guardamos estado inicial en el historial
                history.replaceState({ vista: 'inicio' }, '');
            } catch (error) {
                console.error("Error al cargar productos:", error);
            }
        }
    
        // 1. NIVEL 2: Mostrar Subcategorías al hacer clic en un Círculo Principal
        document.querySelectorAll('#categorias a').forEach(enlace => {
            enlace.addEventListener('click', (e) => {
                e.preventDefault();
                const categoriaPrincipal = e.currentTarget.querySelector('span').innerText.trim();
                
                // Modificamos el historial para que el botón "Atrás" funcione
                history.pushState({ vista: 'subcategorias', categoria: categoriaPrincipal }, '', `#${categoriaPrincipal.toLowerCase()}`);
                
                renderizarSubcategorias(categoriaPrincipal);
            });
        });
    
        function renderizarSubcategorias(categoriaPrincipal) {
            document.getElementById('titulo-seccion').innerText = `Categoría: ${categoriaPrincipal}`;
            
            // Ocultamos elementos grandes en celular para centrar la vista en el catálogo
            const banner = document.querySelector('section.bg-gradient-to-b');
            if (banner) banner.style.display = 'none';

            const subcategoriasAsociadas = mapaCategorias[categoriaPrincipal] || [];
            const grid = document.getElementById('grid-productos');
            grid.innerHTML = '';
    
            if (subcategoriasAsociadas.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No hay subcategorías registradas en esta sección.</p>';
                return;
            }
    
            subcategoriasAsociadas.forEach(subcat => {
                const tarjetaSub = document.createElement('div');
                tarjetaSub.className = "bg-white rounded-xl shadow-sm border p-6 flex flex-col items-center justify-center cursor-pointer hover:shadow-md hover:border-emerald-600 transition group";
                tarjetaSub.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-emerald-50 flex items-center justify-center mb-4 group-hover:bg-emerald-100 transition">
                        <i class="fa-solid fa-folder-open text-2xl text-emerald-700"></i>
                    </div>
                    <h3 class="font-bold text-gray-800 text-center text-base group-hover:text-emerald-700 transition">${subcat}</h3>
                    <span class="text-xs text-gray-400 mt-1">Ver productos</span>
                `;
                
                tarjetaSub.addEventListener('click', () => {
                    history.pushState({ vista: 'productos', subcategoria: subcat }, '', `#sub-${subcat.toLowerCase()}`);
                    mostrarProductosDeSubcategoria(subcat);
                });
    
                grid.appendChild(tarjetaSub);
            });

            // Subimos la pantalla suavemente para que en celular se vea ordenado de inmediato
            document.getElementById('catalogo').scrollIntoView({ behavior: 'smooth' });
        }
    
        // 2. NIVEL 3: Mostrar Productos de la Subcategoría
        function mostrarProductosDeSubcategoria(subcatSeleccionada) {
            document.getElementById('titulo-seccion').innerText = `Subcategoría: ${subcatSeleccionada}`;
            
            const filtrados = todosLosProductos.filter(p => 
                p.subcategorias && p.subcategorias.some(sc => sc.toLowerCase() === subcatSeleccionada.toLowerCase())
            );
            
            renderizarProductos(filtrados);
            document.getElementById('catalogo').scrollIntoView({ behavior: 'smooth' });
        }
    
        // Renderizador de tarjetas de productos
        function renderizarProductos(productos) {
            const grid = document.getElementById('grid-productos');
            grid.innerHTML = ''; 
    
            if (productos.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No hay productos disponibles en esta subcategoría.</p>';
                return;
            }
    
            productos.forEach((prod, index) => {
                const tarjeta = document.createElement('div');
                // Tarjeta compacta, equilibrada y con altura uniforme
                tarjeta.className = "bg-white rounded-xl shadow-sm border p-4 flex flex-col h-full justify-between hover:shadow-md transition";
                
                const inputId = `qty-${prod.sku || index}`;
                const colorContainerId = `colors-${prod.sku || index}`;
                const imgId = `img-${prod.sku || index}`;
                const labelColorId = `selected-color-${prod.sku || index}`;
    
                tarjeta.innerHTML = `
                    <!-- Parte Superior: Imagen y Marca -->
                    <div>
                        <div class="w-full h-44 mb-3 flex items-center justify-center bg-gray-50 rounded-lg overflow-hidden">
                            <img id="${imgId}" src="${prod.imagen_principal}" alt="${prod.nombre}" class="h-full object-contain p-2 transition-all duration-300">
                        </div>
                        <span class="text-xs text-emerald-700 font-semibold bg-emerald-50 px-2.5 py-1 rounded-full">${prod.marca || 'Atlas'}</span>
                        <h3 class="font-medium text-gray-800 text-sm line-clamp-2 mt-2">${prod.nombre}</h3>
                    </div>
                
                    <!-- Parte Central: Precios y Colores -->
                    <div class="my-3">
                        <p class="font-bold text-lg text-gray-900 mb-1">S/ ${prod.precio_regular.toFixed(2)}</p>
                        <p class="text-xs text-gray-500 mb-1.5">Color: <span id="${labelColorId}" class="font-bold text-gray-700">Selecciona</span></p>
                        <div class="flex flex-wrap gap-1.5 max-h-16 overflow-y-auto p-1" id="${colorContainerId}"></div>
                    </div>
                
                    <!-- AQUÍ VA EL NUEVO BLOQUE QUE ACABAMOS DE CREAR -->
                    <div class="mt-auto pt-3 border-t border-gray-100 flex items-center gap-2">
                        <!-- Grupo de +/- -->
                        <div class="flex items-center border rounded-lg h-10 w-24">
                            <button onclick="ajustarCantidad('${inputId}', -1)" class="w-8 h-full flex items-center justify-center text-gray-600 hover:bg-gray-100 hover:text-emerald-700 rounded-l-lg">-</button>
                            <input type="number" value="1" id="${inputId}" class="w-8 h-full text-center text-sm font-semibold focus:outline-none" readonly>
                            <button onclick="ajustarCantidad('${inputId}', 1)" class="w-8 h-full flex items-center justify-center text-gray-600 hover:bg-gray-100 hover:text-emerald-700 rounded-r-lg">+</button>
                        </div>
                        
                        <!-- Botón Agregar -->
                        <button onclick="agregarAlCarrito('${prod.nombre}', ${prod.precio_regular}, '${inputId}', '${labelColorId}')" 
                                class="flex-1 bg-emerald-700 text-white h-10 rounded-lg hover:bg-emerald-800 transition text-sm font-medium shadow-sm">
                            Agregar
                        </button>
                    </div>
                `;
                
                grid.appendChild(tarjeta);
    
                // Renderizado de colores reales
                const containerColores = document.getElementById(colorContainerId);
                const labelColorSeleccionado = document.getElementById(labelColorId);
                const imagenProducto = document.getElementById(imgId);
    
                // Si el producto no trae colores definidos en el JSON, usamos una lista por defecto o vacía
                const coloresDisponibles = prod.colores && prod.colores.length > 0 ? prod.colores : [
                    { nombre: "Rojo", clase: "bg-red-600", imagen: prod.imagen_principal },
                    { nombre: "Azul", clase: "bg-blue-600", imagen: prod.imagen_principal },
                    { nombre: "Amarillo", clase: "bg-yellow-400", imagen: prod.imagen_principal }
                ];
    
                // Seleccionar el primer color por defecto
                if (coloresDisponibles.length > 0) {
                    labelColorSeleccionado.innerText = coloresDisponibles[0].nombre;
                }
    
                coloresDisponibles.forEach((col, idx) => {
                    const btnColor = document.createElement('button');
                    btnColor.type = "button";
                    // Usamos style con la función que retorna el color en hexadecimal
                    btnColor.className = `w-5 h-5 rounded-full focus:outline-none ring-offset-2 ${idx === 0 ? 'ring-2 ring-emerald-600' : ''} transition transform hover:scale-110 shadow-sm`;
                    btnColor.style.cssText = obtenerEstiloColor(col.nombre);
                    btnColor.title = col.nombre;
                    
                    btnColor.onclick = () => {
                        containerColores.querySelectorAll('button').forEach(b => b.classList.remove('ring-2', 'ring-emerald-600'));
                        btnColor.classList.add('ring-2', 'ring-emerald-600');
                        labelColorSeleccionado.innerText = col.nombre;
                        
                        if (col.imagen) {
                            imagenProducto.src = col.imagen;
                        }
                    };
                    containerColores.appendChild(btnColor);
                });
            });
        }
    
        // 3. CONTROL DEL BOTÓN "ATRÁS" DEL NAVEGADOR
        window.addEventListener('popstate', (event) => {
            const estado = event.state;
            const banner = document.querySelector('section.bg-gradient-to-b');

            if (!estado || estado.vista === 'inicio') {
                if (banner) banner.style.display = 'block';
                document.getElementById('titulo-seccion').innerText = "Catálogo de Productos";
                renderizarProductos(todosLosProductos);
            } else if (estado.vista === 'subcategorias') {
                if (banner) banner.style.display = 'none';
                renderizarSubcategorias(estado.categoria);
            } else if (estado.vista === 'productos') {
                if (banner) banner.style.display = 'none';
                mostrarProductosDeSubcategoria(estado.subcategoria);
            }
        });

        function agregarAlCarrito(nombre, precio, inputId, labelColorId) {
            const cantidad = document.getElementById(inputId).value;
            const colorSeleccionado = document.getElementById(labelColorId).innerText;
            alert(`¡Agregado al carrito!\n• Producto: ${nombre}\n• Color: ${colorSeleccionado}\n• Cantidad: ${cantidad}`);
        }

        function ajustarCantidad(inputId, cambio) {
            const input = document.getElementById(inputId);
            let valor = parseInt(input.value) + cambio;
            
            // Evitamos que la cantidad sea menor a 1
            if (valor < 1) valor = 1;
            
            input.value = valor;
        }

        function obtenerEstiloColor(nombreColor) {
            if (!nombreColor) return "background-color: #9ca3af; border: 1px solid #d1d5db;";
            
            const normalizado = nombreColor.toLowerCase().trim();
        
            // Caso especial para Surtido (Degradado multicolor)
            if (normalizado.includes('surtido') || normalizado.includes('multicolor')) {
                return "background: linear-gradient(to right, #ef4444, #eab308, #3b82f6); border: 1px solid #d1d5db;";
            }
        
            // Tu diccionario base con los colores y sus códigos hexadecimales
            const mapaColores = {
                "rojo": "#dc2626",
                "azul": "#2563eb",
                "amarillo": "#facc15",
                "verde": "#16a34a",
                "verde oscuro": "#065f46",
                "verde limón": "#84cc16",
                "celeste": "#38bdf8",
                "anaranjado": "#f97316",
                "naranja": "#f97316",
                "lila": "#c084fc",
                "rosado": "#f472b6",
                "rosa": "#f472b6",
                "blanco": "#ffffff",
                "negro": "#111827",
                "marrón": "#92400e"
            };
        
            // Si está en el diccionario, usa su color exacto
            if (mapaColores[normalizado]) {
                return `background-color: ${mapaColores[normalizado]}; border: 1px solid #d1d5db;`;
            }
        
            // Si no está registrado, se muestra en gris como aviso visual para que lo agregues
            return "background-color: #9ca3af; border: 1px solid #d1d5db;";
        }
            
        cargarCatalogo();
    </script>
    
</body>
</html>
