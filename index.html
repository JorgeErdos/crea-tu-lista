<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda de Útiles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        /* Contenedor de las tarjetas */
        #contenedor-productos {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Estilo de la tarjeta */
        .tarjeta {
            background: white;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarjeta h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #222;
        }
        .precio {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }
        /* Contenedor de los botones de colores */
        .grupo-colores {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        /* Botón de color normal */
        .btn-color {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            padding: 5px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-color:hover:not(:disabled) {
            background-color: #d0d0d0;
        }
        /* Estilo cuando el color no tiene stock */
        .btn-color:disabled {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.6;
        }
        /* Botón de compra general */
        .btn-comprar {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .btn-comprar:hover {
            background-color: #1ebe57;
        }
    </style>
</head>
<body>

    <h1>Catálogo de Útiles</h1>
    
    <!-- Aquí es donde JavaScript inyectará las tarjetas -->
    <div id="contenedor-productos">Cargando productos...</div>

    <script>
        // Función para cargar el archivo productos.json
        async function cargarCatalogo() {
            try {
                // Realiza la petición al archivo JSON que subiste al repositorio
                const respuesta = await fetch('productos.json');
                if (!respuesta.ok) throw new Error('No se pudo cargar el archivo JSON');
                
                const productos = await respuesta.json();
                const contenedor = document.getElementById('contenedor-productos');
                
                // Limpia el mensaje de "Cargando..."
                contenedor.innerHTML = '';

                // Recorre cada producto del archivo JSON
                productos.forEach(producto => {
                    // Crea el elemento visual de la tarjeta
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta';

                    // Construye los botones de colores de forma dinámica
                    let botonesColoresHTML = '<div class="grupo-colores">';
                    producto.colores.forEach(color => {
                        // Revisa si el color actual está dentro de la lista de colores sin stock
                        const estaAgotado = producto.colores_sin_stock.includes(color);
                        
                        // Si está agotado, agregamos el atributo 'disabled'
                        botonesColoresHTML += `
                            <button class="btn-color" ${estaAgotado ? 'disabled' : ''}>
                                ${color} ${estaAgotado ? '(Agotado)' : ''}
                            </button>
                        `;
                    });
                    botonesColoresHTML += '</div>';

                    // Rellena el contenido interno de la tarjeta
                    tarjeta.innerHTML = `
                        <div>
                            <img src="${producto.imagen}" alt="${producto.nombre}" style="width:100%; height:150px; object-fit: cover; border-radius: 4px; margin-bottom: 8px;">
                            <h3>${producto.nombre}</h3>
                            <div class="precio">S/ ${producto.precio.toFixed(2)}</div>
                            ${botonesColoresHTML}
                        </div>
                        <button class="btn-comprar" onclick="alert('Comprar ${producto.nombre}')">Pedir por WhatsApp</button>
                    `;

                    // Agrega la tarjeta completa al contenedor principal de la página
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('contenedor-productos').innerHTML = '<p>Hubo un error al cargar el catálogo.</p>';
            }
        }

        // Ejecuta la función al cargar la página
        cargarCatalogo();
    </script>

</body>
</html>
