<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Catálogo</title>
    <style>
        /* Estilos generales del catálogo */
        body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
        .catalogo { display: flex; flex-wrap: wrap; gap: 20px; }
        .tarjeta { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; text-align: center; }
        .tarjeta img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .precio { color: #27ae60; font-weight: bold; margin: 10px 0; }
        
        /* Estilos de la Ventana Modal (la que flota) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; /* Oculto por defecto */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-contenido {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            position: relative;
            text-align: left;
        }
        .cerrar-modal {
            position: absolute;
            top: 10px; right: 15px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
        }
        .btn-opciones {
            background: #3498db; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <h1>Mi Catálogo de Productos</h1>
    
    <!-- Aquí es donde JavaScript dibujará las tarjetas de tus productos -->
    <div id="contenedor-catalogo" class="catalogo"></div>

    <!-- VENTANA MODAL (Oculta hasta que hacen clic en un producto) -->
    <div id="modal-producto" class="modal">
        <div class="modal-contenido">
            <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
            <h2 id="modal-titulo">Nombre</h2>
            
            <img id="modal-imagen" src="" alt="Imagen del producto" style="width: 100%; height: 200px; object-fit: contain;">
            
            <p id="modal-precio" class="precio"></p>

            <!-- Menú desplegable para los 20+ colores -->
            <label for="select-color"><strong>Color:</strong></label><br>
            <select id="select-color" style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"></select>

            <!-- Selector de cantidad -->
            <label for="input-cantidad"><strong>Cantidad:</strong></label><br>
            <input type="number" id="input-cantidad" value="1" min="1" style="width: 100%; padding: 8px; margin: 5px 0 15px 0;">

            <!-- Botón final -->
            <button style="background: #25d366; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer;">
                Pedir por WhatsApp
            </button>
        </div>
    </div>

    <!-- EL CEREBRO (JavaScript) -->
    <script>
        let listaProductos = [];

        // 1. Cargar el archivo productos.json al abrir la página
        fetch('productos.json')
            .then(respuesta => respuesta.json())
            .then(datos => {
                listaProductos = datos;
                mostrarCatalogo(listaProductos);
            })
            .catch(error => console.error('Hubo un error cargando los productos:', error));

        // 2. Dibujar las tarjetas limpias en la página principal
        function mostrarCatalogo(productos) {
            const contenedor = document.getElementById('contenedor-catalogo');
            contenedor.innerHTML = '';

            productos.forEach((producto, index) => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                
                tarjeta.innerHTML = `
                    <img src="${producto.imagen}" alt="${producto.nombre}">
                    <h3>${producto.nombre}</h3>
                    <div class="precio">S/ ${producto.precio.toFixed(2)}</div>
                    <button class="btn-opciones" onclick="abrirModal(${index})">Ver opciones</button>
                `;
                
                contenedor.appendChild(tarjeta);
            });
        }

        // 3. Abrir el modal y rellenarlo con la información del producto seleccionado
        function abrirModal(index) {
            const producto = listaProductos[index];

            document.getElementById('modal-titulo').innerText = producto.nombre;
            document.getElementById('modal-imagen').src = producto.imagen;
            document.getElementById('modal-precio').innerText = `S/ ${producto.precio.toFixed(2)}`;

            // Llenar el menú desplegable con los colores (aquí entran tus 20+ colores sin ocupar espacio)
            const selectColor = document.getElementById('select-color');
            selectColor.innerHTML = ''; // Limpiar colores anteriores
            
            producto.colores.forEach(color => {
                let opcion = document.createElement('option');
                opcion.value = color;
                opcion.innerText = color;
                selectColor.appendChild(opcion);
            });

            // Mostrar el modal cambiando su estilo a flex
            document.getElementById('modal-producto').style.display = 'flex';
        }

        // 4. Cerrar el modal
        function cerrarModal() {
            document.getElementById('modal-producto').style.display = 'none';
        }
    </script>
</body>
</html>
